name: Daily Market Sentiment Monitor

on:
  schedule:
    # 2:30 UTC = 8:00 AM IST, Monday-Friday (NSE/BSE closed Sat/Sun)
    - cron: "30 2 * * 1-5"
  workflow_dispatch: # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed to commit the day's results back to the repo

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run market sentiment monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scraper.main

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: market sentiment $(date -u +%Y-%m-%d)"
          git push
